name: build-probe

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: android-actions/setup-android@v4

      - name: 装 NDK 与 SDK 组件
        run: |
          sdkmanager --install "ndk;27.0.12077973" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: 装 cargo-ndk
        run: command -v cargo-ndk || cargo install cargo-ndk --locked

      - name: 取 quiche 源码并打 ECH 补丁
        run: |
          set -e
          curl -sSL https://static.crates.io/crates/quiche/quiche-0.22.0.crate -o /tmp/quiche.crate
          mkdir -p rust/vendor && tar -xzf /tmp/quiche.crate -C rust/vendor
          rm -rf rust/vendor/quiche && mv rust/vendor/quiche-0.22.0 rust/vendor/quiche
          python3 tools/patch_quiche.py rust/vendor/quiche

      - name: 编译 Rust 动态库（构建铁律：只留主库 + 验符号）
        run: |
          set -e
          cd rust
          cargo ndk -t arm64-v8a -t armeabi-v7a -o ../app/src/main/jniLibs build --release
          echo "--- 产物"
          find ../app/src/main/jniLibs -name "*.so" -exec ls -la {} \;
          # 铁律：多余 libquiche*.so 一律删掉，只留主库
          find ../app/src/main/jniLibs -name "libquiche*.so" -delete
          NM=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm
          for abi in arm64-v8a armeabi-v7a; do
            echo "--- $abi 符号校验"
            $NM -D ../app/src/main/jniLibs/$abi/libech_h3_probe.so | grep -c "Java_com_anglesgirl_echh3probe_ProbeNative_h3Fetch" \
              || { echo "✗ JNI 符号缺失"; exit 1; }
          done

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 先只编 Kotlin（语法问题要立刻暴露，不等 NDK）
        run: gradle compileDebugKotlin --no-daemon

      - name: 打 APK
        run: gradle assembleDebug --no-daemon

      - name: 发布 APK（避免占用 Actions 产物配额）
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "APK=$APK  ($(du -h "$APK" | cut -f1))"
          TAG="probe-${{ github.run_number }}"
          gh release create "$TAG" "$APK" --title "ECH-H3 探针 $TAG" --notes "提交 ${{ github.sha }}" || gh release upload "$TAG" "$APK" --clobber
          gh release view "$TAG" --json tagName,assets -q '.tagName, (.assets[].name)'

      # 成功/失败都通知；只发文字（附件由本机 Bot API 发，CI 直传要十几分钟）
      - name: 通知构建结果
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if [ -z "${TG_TOKEN:-}" ] || [ -z "${TG_CHAT:-}" ]; then
            echo "缺少 TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID，跳过通知"; exit 0
          fi
          # 注意：GitHub 的 run 默认是 bash -e，任何一条非零退出都会让整步瞬间失败；
          # 也不能把 stderr 丢掉，否则失败时日志一片空白，根本看不出原因。
          APK=$(find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -1 || true)
          SIZE="-"
          if [ -n "$APK" ]; then SIZE=$(stat -c%s "$APK" || echo "?"); fi
          FAILED=$(gh run view "$RUN_ID" --repo "$REPO" --json jobs \
            -q '[.jobs[].steps[] | select(.conclusion=="failure") | .name] | join(", ")' 2>&1 || true)
          echo "APK=${APK:-无} size=$SIZE failed_step=${FAILED:-无}"
          TEXT=$(printf '【ECH-H3 探针】%s\nSHA: %.7s\nAPK: %s (%s 字节)\n失败步骤: %s\nhttps://github.com/%s/actions/runs/%s' \
            "$JOB_STATUS" "$SHA" "$(basename "${APK:-无}")" "$SIZE" "${FAILED:-无}" "$REPO" "$RUN_ID")
          RESP=$(curl -sS --fail-with-body -X POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" --data-urlencode "text=${TEXT}") || { echo "✗ 请求失败: $RESP"; exit 1; }
          echo "$RESP" | grep -q '"ok":true' || { echo "✗ Telegram 未确认送达: $RESP"; exit 1; }
          echo "✓ 通知已送达"
